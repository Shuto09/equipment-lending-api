name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # 単体・Web 層に加え、Testcontainers（ランナーの Docker）で PostgreSQL 17 を使うテストまで全部流す
      - name: Verify
        run: ./mvnw -B -ntp verify
