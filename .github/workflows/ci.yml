name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # 単体・Web 層に加え、Testcontainers（ランナーの Docker）で PostgreSQL を使うテストまで全部流す
      - name: Verify
        run: ./mvnw -B -ntp verify
