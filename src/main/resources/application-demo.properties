# demo プロファイル: 架空の初期データ（db/demo/R__demo_data.sql）も流す
spring.flyway.locations=classpath:db/migration,classpath:db/demo

# デモの認証（X-User-Id）は誰でも ADMIN を名乗れるので、この端末の中（127.0.0.1）からだけ受け付ける
# （compose.yaml の DB と同じ考え方）。ほかの端末から使うときは、自分の責任で SERVER_ADDRESS を変える。
# 全プロファイル共通の application.properties には書かない（コンテナで動かすときに困るため）。
server.address=127.0.0.1
