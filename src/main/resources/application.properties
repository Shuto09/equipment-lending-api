spring.application.name=equipment-lending-api

# 業務の設定（docs/要件と設計.md §4）
lending.zone=Asia/Tokyo
lending.max-loan-days=14
lending.max-open-loans-per-borrower=3

# MyBatis: SQL はすべて XML に書く（§10）
mybatis.mapper-locations=classpath:mapper/**/*.xml
mybatis.type-aliases-package=com.example.lending.equipment,com.example.lending.loan,com.example.lending.user

# 入力検証のメッセージを日本語にそろえる（要求の Accept-Language で変わらないように）
spring.web.locale=ja
spring.web.locale-resolver=fixed

# エラー応答（ProblemDetail）の項目を RFC 9457 の並び（type・title・status・detail・instance）で出す
# （Jackson 3 は既定で項目名の辞書順に並べる。record の応答は宣言の順のまま）
spring.jackson.mapper.sort-properties-alphabetically=false

# OpenAPI: 応答の型を application/json と書く（既定は */*）
springdoc.default-produces-media-type=application/json

# Actuator は health だけを公開する
management.endpoints.web.exposure.include=health

# 手元では compose.yaml の PostgreSQL を spring-boot-docker-compose が起動して接続する
